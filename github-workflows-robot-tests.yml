name: Robot Framework Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Initialize Browser library
      run: |
        rfbrowser init
    
    - name: Run Robot Framework tests
      run: |
        robot --outputdir test-results \
               --loglevel DEBUG \
               --variable HEADLESS:True \
               tests/
      continue-on-error: true
    
    - name: Generate report
      run: |
        rebot --outputdir test-results \
              --merge test-results/output.xml
      if: always()
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: |
          test-results/log.html
          test-results/report.html
          test-results/output.xml
    
    - name: Publish test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Robot Test Results (Python ${{ matrix.python-version }})
        path: 'test-results/output.xml'
        reporter: 'java-junit'
